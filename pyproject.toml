[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-tax"
version = "0.1.0"
description = "Audit which files will burn coding-agent context tokens — and what to ignore"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yogeshwar C M", email = "cmyogeshwar@gmail.com" }]
keywords = ["llm", "tokens", "context", "agents", "claude", "copilot", "cursor", "cost"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
context-tax = "context_tax.cli:main"

[project.urls]
Homepage = "https://github.com/Yogeshwar-CM/context-tax"
Repository = "https://github.com/Yogeshwar-CM/context-tax"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
